services:
  app:
    build: .
    container_name: thumbnail-app
    ports:
      - "5000:5000"
    volumes:
      # Solo persistir la base de datos de usuarios
      - thumbnail_db:/app/db_data
    environment:
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-thumbnail_generator_secure_key_change_me}
      - DATABASE_PATH=/app/db_data/thumbnail_users.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: thumbnail-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

# Volumen persistente solo para la base de datos
volumes:
  thumbnail_db:
    driver: local