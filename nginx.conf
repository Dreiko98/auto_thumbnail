# Configuración de Nginx para Thumbnail Generator
# Ubicación: /etc/nginx/sites-available/thumbnail-generator

server {
    listen 80;
    server_name 100.87.242.53;  # Cambia esto por tu dominio si tienes uno

    # Logs
    access_log /var/log/nginx/thumbnail_access.log;
    error_log /var/log/nginx/thumbnail_error.log;

    # Archivos estáticos
    location /static/ {
        alias /home/germanmallo/auto_thumbnail/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy a Gunicorn
    location / {
        include proxy_params;
        proxy_pass http://unix:/tmp/thumbnail.sock;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffer size para uploads grandes
        client_max_body_size 50M;
        proxy_request_buffering off;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}